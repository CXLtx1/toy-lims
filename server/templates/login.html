<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>登录 · LabFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/mes.png?v=20260902">
<link rel="stylesheet" href="/static/style.css?v=20260902-labflow"></head>
<body class="auth-page"><form class="auth-card" method="post">
  <h1>LabFlow</h1><p>选择这台设备使用的终端入口</p>
  {% if kicked %}<div class="auth-error">该登录已在其他设备使用，本机已下线，请重新登录。</div>{% endif %}
  {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  <div class="terminal-kind-choices" role="group" aria-label="终端类型">
    <button type="button" data-kind="standard"><b>标准</b><small>终端密码</small></button>
    <button type="button" data-kind="personal"><b>个人</b><small>用户账号</small></button>
    <button type="button" data-kind="admin"><b>管理</b><small>管理密码</small></button>
  </div>
  <input id="login-terminal-kind" name="terminal_kind" type="hidden" value="{{ selected_terminal_kind }}">
  <fieldset id="terminal-selection" class="terminal-choices"{% if selected_terminal_kind == 'personal' %} hidden{% endif %}>
    <legend>选择终端</legend>
    {% for terminal in terminals %}
    <label class="terminal-choice" data-kind="{{ terminal.kind }}">
      <input name="terminal_id" type="radio" value="{{ terminal.id }}" data-kind="{{ terminal.kind }}" required{% if selected_terminal_id == terminal.id or (not selected_terminal_id and loop.first) %} checked{% endif %}{% if loop.first %} autofocus{% endif %}>
      <span><b>{{ terminal.name }}</b><small>{{ {'admin': '管理终端', 'personal': '个人终端', 'standard': '标准终端'}[terminal.kind] }}</small></span>
    </label>
    {% endfor %}
    <p id="terminal-kind-empty" class="terminal-kind-empty" hidden>该类型暂无启用终端，请先在“用户”页添加。</p>
  </fieldset>
  <div id="personal-terminal-info" class="personal-terminal-info"{% if selected_terminal_kind != 'personal' %} hidden{% endif %}>
    <b>个人终端</b>
    <span>无需选择设备。所有启用用户均可使用自己的用户名和用户密码登录，操作按本人权限执行并记录。</span>
  </div>
  <label id="login-username-field"{% if selected_terminal_kind != 'personal' %} hidden{% endif %}>用户名<input name="username" value="{{ username }}" autocomplete="username"></label>
  <label><span id="login-password-label">终端密码</span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
  <button id="login-submit" class="primary" type="submit">进入终端</button>
</form>
<script>
(() => {
  const choices = [...document.querySelectorAll('[name="terminal_id"]')];
  const kindButtons = [...document.querySelectorAll('.terminal-kind-choices button')];
  const kindInput = document.getElementById('login-terminal-kind');
  const terminalSelection = document.getElementById('terminal-selection');
  const personalInfo = document.getElementById('personal-terminal-info');
  const usernameField = document.getElementById('login-username-field');
  const username = usernameField.querySelector('input');
  const passwordLabel = document.getElementById('login-password-label');
  const empty = document.getElementById('terminal-kind-empty');
  const submit = document.getElementById('login-submit');
  const kindLabels = { standard: '标准', personal: '个人', admin: '管理' };
  function selectKind(kind) {
    const visible = choices.filter((choice) => choice.dataset.kind === kind);
    const personal = kind === 'personal';
    kindInput.value = kind;
    kindButtons.forEach((button) => {
      const active = button.dataset.kind === kind;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    choices.forEach((choice) => { choice.closest('.terminal-choice').hidden = choice.dataset.kind !== kind; });
    if (!personal && !visible.some((choice) => choice.checked)) {
      choices.forEach((choice) => { choice.checked = false; });
      if (visible[0]) visible[0].checked = true;
    }
    terminalSelection.hidden = personal;
    personalInfo.hidden = !personal;
    usernameField.hidden = !personal;
    username.required = personal;
    passwordLabel.textContent = personal ? '用户密码' : '终端密码';
    empty.hidden = personal || visible.length > 0;
    submit.disabled = !personal && visible.length === 0;
    submit.textContent = `进入${kindLabels[kind]}终端`;
  }
  kindButtons.forEach((button) => button.addEventListener('click', () => selectKind(button.dataset.kind)));
  selectKind(kindInput.value || choices.find((choice) => choice.checked)?.dataset.kind || 'standard');
})();
</script></body></html>
